# The gate on every push to main and every pull request: `make check`, on Linux and macOS, the two
# systems pickpen runs on. pickpen is one file made by pencere's Lua runner, and until pencere has
# a release the runner is built here from the branch of pencere that has what pickpen needs of it
# (`io.read_stdin`, `io.is_terminal`, `serve{ filter = true }`, `close_view`, `session = true`). When
# pencere has a release with them, this fetches the runner instead and the build goes away.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pencere, with the runner and the stand-in terminal built
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bateri/pencere
          ref: wt/pickpen
          path: pencere
      - name: Build pencere's runner and stand-in terminal
        working-directory: pencere
        run: |
          cargo build --release -p pencere-cli
          cargo build -p pencere-fake-host
      - name: make check
        run: |
          make check \
            PENCERE="$PWD/pencere/target/release/pencere" \
            FAKE_HOST="$PWD/pencere/target/debug/pencere-fake-host" \
            PENCERE_KIT="$PWD/pencere/kit/luau/prelude"
