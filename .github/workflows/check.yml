# The gate on every push to main and every pull request: `make check` (rustfmt, clippy and StyLua,
# the program built, its tests, the view's tests against the kit, the built program played with
# nobody to ask and in a pane by pencere's stand-in terminal, and the installer's tests), on Linux
# and macOS.
#
# pencere, which pickpen is built and tested with, is the one Cargo.lock takes: the program is built
# on that crate, and `make check` fetches pencere at the same commit or release tag and builds its
# command and its stand-in terminal there (`make pencere`), as it does on a maintainer's machine, so
# the view's tests and the end-to-end tests hold pickpen to the pencere it is built with and to
# nothing else. Moving it is a change of Cargo.toml and Cargo.lock, and of nothing here.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The toolchain the crate's rust-version names, so a new lint of a later release does not turn
      # the gate red on code nobody touched.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gate
          workspaces: . -> target
      - name: Install StyLua
        run: cargo install stylua --locked --features luau --version 2.6.0 --root "$RUNNER_TEMP/stylua"
      - name: make check
        run: |
          export PATH="$RUNNER_TEMP/stylua/bin:$PATH"
          make check
      - name: Say what the gate was held to
        run: |
          {
            echo "### What this run was held to"
            echo
            echo "pencere at \`$(node tools/release.mjs pencere-ref)\` (\`Cargo.lock\`): the crate the program is built on, and its \`pencere\` command, its \`pencere-fake-host\` and the prelude of its kit (\`kit/luau/prelude\`) that the view's tests run the view against."
          } >> "$GITHUB_STEP_SUMMARY"
