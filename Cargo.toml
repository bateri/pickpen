[package]
name = "pickpen"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Choose rows in the middle of a pipeline, in a real interface in the terminal pane"
license = "GPL-3.0-or-later"
repository = "https://github.com/bateri/pickpen"
publish = false

[[bin]]
name = "pickpen"
path = "src/program/main.rs"

[dependencies]
# The program's side of pencere, at the commit that has `pencere dist`, which writes the app.json of
# a release (the release on crates.io does not yet): every pencere crate here is at this one `rev`,
# which Cargo.lock holds and `make pencere` and `make dev` build the terminal from.
pencere = { git = "https://github.com/bateri/pencere", rev = "02b59c336724a6010b042518d49400a077381708" }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"

# The build script carries src/view/ and src/assets/ into the binary (`pencere::build::app`).
[build-dependencies]
pencere = { git = "https://github.com/bateri/pencere", rev = "02b59c336724a6010b042518d49400a077381708" }

[profile.release]
lto = true
codegen-units = 1
strip = true
